# Throwaway Gitea instance used as the git platform for the Renovate
# regression tests. Renovate needs a real git host to create branches and PRs.
name: renovate-preset-tests
services:
  gitea:
    image: docker.gitea.com/gitea:1.24-rootless
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__repository__DEFAULT_BRANCH: main
      GITEA__log__LEVEL: warn
      # Process background work (such as PR mergeability checks) synchronously, so
      # automerging several PRs in one Renovate run doesn't race with Gitea's queues.
      GITEA__queue__TYPE: immediate
      # Workflows in the test repositories must not run, their checks would stay pending.
      GITEA__actions__ENABLED: "false"
      # Renovate uses partial clones and fetches missing objects on demand. Like
      # GitHub, serve any object, not only ones reachable from a branch tip.
      GITEA__git_0X2E_config__uploadpack_0X2E_allowAnySHA1InWant: "true"
    ports:
      - "127.0.0.1::3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/healthz"]
      interval: 1s
      timeout: 2s
      retries: 60
