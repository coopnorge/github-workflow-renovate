name: CI/CD
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  setup:
    permissions:
      contents: read
      pull-requests: read
    name: Setup
    runs-on: ubuntu-slim
    outputs:
      run-kubernetes-ci: ${{ ( steps.changes.outputs.kubernetes == 'true' || steps.changes.outputs.workflows == 'true' ) && github.event_name == 'pull_request' }}
      validate-policy-bot-config: ${{ steps.changes.outputs.policy-bot == 'true' && github.event_name == 'pull_request' }}
      techdocs: >-
        ${{ steps.changes.outputs.techdocs == 'true' || steps.changes.outputs.workflows == 'true' }}
      run-renovate-tests: ${{ steps.changes.outputs.renovate == 'true' || steps.changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          list-files: json
          filters: .github/path-filters.yaml
      - name: Debug ...
        run: |
          echo "${{ toJSON(steps.changes.outputs) }}"

  kubernetes-ci:
    # this job is here by default to validate the pallet configurations in the
    # ./pallet folder
    name: "Kubernetes CI"
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ${{ github.repository }}-${{ github.workflow }}-kubernetes-ci-${{ github.ref }}
      cancel-in-progress: true
    needs: setup
    if: needs.setup.outputs.run-kubernetes-ci == 'true'
    uses: coopnorge/github-workflow-kubernetes-validation/.github/workflows/kubernetes-validation.yaml@v2.1.5
    secrets:
      argocd-api-token: ${{ secrets.ARGOCD_API_TOKEN }}

  policy-bot:
    name: "Validate policy-bot configuration"
    needs: setup
    if: needs.setup.outputs.validate-policy-bot-config == 'true'
    uses: coopnorge/github-workflow-policy-bot-config-validation/.github/workflows/policy-bot-config-validation.yaml@v0.1.7
    permissions:
      contents: read
    secrets:
      policy-bot-server-url: ${{ secrets.POLICY_BOT_BASE_URL }}

  renovate-tests:
    # Runs the Renovate image of renovate.yaml with the presets against test
    # repositories, see "Regression tests" in docs/index.md.
    name: "Renovate regression tests"
    needs: setup
    if: needs.setup.outputs.run-renovate-tests == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.repository }}-${{ github.workflow }}-renovate-tests-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Upload Renovate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-test-output
          path: tests/.output/
          include-hidden-files: true

  validate-ci-results:
    needs:
      - kubernetes-ci
      - policy-bot
      - renovate-tests
      - techdocs
    if: failure() || cancelled()
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - run: exit 1
        name: "Catch errors"
  techdocs:
    needs: setup
    if: needs.setup.outputs.techdocs == 'true'
    concurrency:
      group: ${{ github.repository }}-${{ github.workflow }}-techdocs-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: coopnorge/github-workflow-techdocs/.github/workflows/techdocs.yaml@v0.6.1
