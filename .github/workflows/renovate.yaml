on:
  workflow_call:
    inputs:
      post-upgrade-command:
        type: string
        required: false
        description: |
          Command to run after upgrade.
      post-upgrade-env-vars:
        type: string
        required: false
        description: |
          Extra environment variables for post-upgrade tasks.
          Format: KEY=VALUE per line. If no '=', takes the value from current env.
      config-file:
        type: string
        default: .github/renovate.json5
        required: false
        description: |
          Configuration file to use.
      extra-env-vars:
        type: string
        required: false
        description: |
          Extra environment variables to set.
          Format: KEY=VALUE per line.
      log-level:
        type: string
        default: info
        required: false
        description: |
          Log level.
          Supported: trace, debug, info, warn, error, fatal
          Default: info
      gcp-workload-identity-provider:
        type: string
        required: false
        description: |
          Full identifier of the Workload Identity Provider,
          e.g. projects/889992792607/locations/global/workloadIdentityPools/github-actions/providers/github-actions-provider
          Defaults to `vars.PALLET_WORKLOAD_IDENTITY_PROVIDER`.
      gcp-service-account:
        type: string
        required: false
        description: |
          Email address or unique identifier of the Google Cloud service
          account for which to impersonate and generate credentials.
          Defaults to `vars.PALLET_SERVICE_ACCOUNT`.
      renovate-enabled-managers:
        type: string
        required: false
        description: |
          Allows to override the managers uses in this renovate run. It can be used to
          limit which types of depenencies can be updated. Input should be an json array
          as a string.
      renovate-include-paths:
        type: string
        required: false
        description: |
          Limit which directories renovate scans. It can be used to
          limit which types of depenencies can be updated. Input should be an json array
          as a string.

    secrets: {}

env:
  RENOVATE_CUSTOM_IMAGE: ocreg.invalid/renovate
  RENOVATE_CUSTOM_IMAGE_VERSION: latest
  RENOVATE_IMAGE: ghcr.io/renovatebot/renovate
  RENOVATE_VERSION: 43.288.0
  RENOVATE_APP_CLIENT_ID: Iv1.88c3ccbe8bdd86af
  GITHUB_ORG: coopnorge
  SELF_REPO: coopnorge/github-workflow-renovate
  # This is the dir renovate provides -- if we set our own directory via cacheDir, we can run into permissions issues.
  # It is also possible to cache a higher level of the directory, but it has minimal benefit. While renovate execution
  # time gets faster, it also takes longer to upload the cache as it grows bigger.
  cache_dir: /tmp/renovate/cache/renovate/repository
  # This can be manually changed to bust the cache if necessary.
  cache_key: renovate-cache

jobs:
  renovate:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Choose custom image or fallback to default image
        id: choose-custom-image
        run: |
          # Detect if a custom image is required to run for a given repo
          if [ -f terraform-docs.yml ]; then
            echo "Using custom image for terraform module"
            echo "custom-image=terraform-modules" >> $GITHUB_OUTPUT
          else
            echo "Using default image"
            echo "custom-image=false" >> $GITHUB_OUTPUT
          fi

      - name: Get workflow version
        id: get-workflow-version
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          CALLED_VERSION=$(echo "$WORKFLOW_REF" | awk -F'@' '{print $2}')
          CALLED_VERSION="${CALLED_VERSION:-main}"
          echo "called-version=$CALLED_VERSION" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v7
        if: steps.choose-custom-image.outputs.custom-image != 'false'
        with:
          repository: ${{ env.SELF_REPO }}
          ref: ${{ steps.get-workflow-version.outputs.called-version }}
          sparse-checkout: |
            images/
          path: .temp/github-workflow-renovate

      - if: steps.choose-custom-image.outputs.custom-image != 'false'
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - if: steps.choose-custom-image.outputs.custom-image != 'false'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - if: steps.choose-custom-image.outputs.custom-image != 'false'
        name: Build custom renovate image
        run: |
          docker buildx build -f .temp/github-workflow-renovate/images/${{ steps.choose-custom-image.outputs.custom-image }}.Dockerfile -t $RENOVATE_CUSTOM_IMAGE:$RENOVATE_CUSTOM_IMAGE_VERSION --load .

      - name: Determine renovate image and version to use
        id: renovate-version
        env:
          CUSTOM_IMAGE: ${{ steps.choose-custom-image.outputs.custom-image }}
        run: |
          if [ "$CUSTOM_IMAGE" != "false" ]; then
            echo "renovate-image=$RENOVATE_CUSTOM_IMAGE" >> $GITHUB_OUTPUT
            echo "renovate-version=$RENOVATE_CUSTOM_IMAGE_VERSION" >> $GITHUB_OUTPUT
          else
            echo "renovate-image=$RENOVATE_IMAGE" >> $GITHUB_OUTPUT
            echo "renovate-version=$RENOVATE_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Get GitHub token
        id: get_github_token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ env.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY_PEM }}
          owner: ${{ env.GITHUB_ORG }}

      - name: Resolve GCP auth settings
        id: gcp-auth-config
        shell: bash
        run: |
          provider="${{ inputs.gcp-workload-identity-provider }}"
          service_account="${{ inputs.gcp-service-account }}"

          if [ -z "$provider" ]; then
            provider="${{ vars.PALLET_WORKLOAD_IDENTITY_PROVIDER }}"
          fi

          if [ -z "$service_account" ]; then
            service_account="${{ vars.PALLET_SERVICE_ACCOUNT }}"
          fi

          echo "gcp_workload_identity_provider=$provider" >> "$GITHUB_OUTPUT"
          echo "gcp_service_account=$service_account" >> "$GITHUB_OUTPUT"

      - name: Authenticate with GCP
        id: gcp-auth
        if: ${{ steps.gcp-auth-config.outputs.gcp_workload_identity_provider != '' && steps.gcp-auth-config.outputs.gcp_service_account != '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ steps.gcp-auth-config.outputs.gcp_workload_identity_provider }}
          service_account: ${{ steps.gcp-auth-config.outputs.gcp_service_account }}
          create_credentials_file: true

      - name: Configure GCP auth
        if: steps.gcp-auth.outcome == 'success'
        run: |
          for REGION in \
            "EUROPE" \
            "EUROPE__NORTH1" \
          ;
            do
              for MAPPING in \
                "DOCKER:DOCKER" \
                "MAVEN:MAVEN" \
                "NPM:NPM" \
                "PYPI:PYTHON" \
                "GO:GO" \
                "APT:APT" \
                "RPM:YUM" \
                "NUGET:NUGET" \
                "RUBYGEMS:RUBY" \
                "CARGO:CARGO" \
                "HELM:DOCKER" \
              ;
                do
                  PREFIX="${MAPPING%%:*}"
                  SUFFIX="${MAPPING##*:}"

                  printf '%s\n' \
                    "RENOVATE_${PREFIX}_${REGION}__${SUFFIX}_PKG_DEV_TOKEN=${{ steps.gcp-auth.outputs.access_token }}" \
                    >> "$GITHUB_ENV"
                done
            done

      - name: Configure Post-Upgrade Tasks
        if: inputs.post-upgrade-command
        env:
          POST_UPGRADE_COMMAND: ${{ inputs.post-upgrade-command }}
        run: |
          COMMANDS_JSON=$(echo "$POST_UPGRADE_COMMAND" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [[ "$COMMANDS_JSON" != "[]" ]]; then
            echo "RENOVATE_POST_UPGRADE_TASKS={\"commands\": $COMMANDS_JSON, \"executionMode\": \"branch\"}" >> $GITHUB_ENV
          fi

      - name: Configure extra environment variables
        id: config-env
        env:
          EXTRA_ENV_VARS: ${{ inputs.extra-env-vars }}
        run: |
          EXTRA_KEYS=""
          if [[ -n "$EXTRA_ENV_VARS" ]]; then
            while read -r line || [[ -n "$line" ]]; do
              if [[ -n "$line" ]]; then
                echo "$line" >> $GITHUB_ENV
                KEY=${line%%=*}
                if [[ -n "$KEY" ]]; then
                  if [[ -z "$EXTRA_KEYS" ]]; then
                    EXTRA_KEYS="$KEY"
                  else
                    EXTRA_KEYS="$EXTRA_KEYS|$KEY"
                  fi
                fi
              fi
            done <<< "$EXTRA_ENV_VARS"
          fi

          BASE_REGEX="RENOVATE_\\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|AWS_TOKEN|GONOPROXY|GONOSUMDB|GOPRIVATE"
          if [[ -n "$EXTRA_KEYS" ]]; then
            FINAL_REGEX="^(?:$BASE_REGEX|$EXTRA_KEYS)$"
          else
            FINAL_REGEX="^(?:$BASE_REGEX)$"
          fi

          echo "env-regex=$FINAL_REGEX" >> $GITHUB_OUTPUT

      - name: Check if this is Go OCI release and limit renovate manager
        id: renovate_enabled_managers
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          EXPECTED_TITLE="Go OCI Release ${TAG_NAME}"

          # Fetch release title (returns empty string if release does not exist)
          RELEASE_TITLE=$(gh release view "$TAG_NAME" --json name -q '.name' 2>/dev/null || echo "")

          if [ "$RELEASE_TITLE" = "$EXPECTED_TITLE" ]; then
            echo "Release title matched: '$RELEASE_TITLE'"
            echo 'managers=["helm-values"]' >> "$GITHUB_OUTPUT"
            echo 'include_paths="infrastructure/kubernetes/helm/**"' >> "$GITHUB_OUTPUT"
            echo 'issue_title="Dependency Dashboard OCI Helm updates"'

      - name: Patch issue title
        id: issue_title
        if: ${{ inputs.renovate-enabled-managers || inputs.renovate-include-paths }}
        run: |
          echo 'issue_title="Dependency Dashboard OCI Helm updates"'

      - name: Forward env
        env:
          # Repository taken from variable to keep configuration file generic
          RENOVATE_REPOSITORIES: ${{ env.RENOVATE_REPOSITORIES || github.repository }}
          # Onboarding not needed for self-hosted
          RENOVATE_ONBOARDING: ${{ env.RENOVATE_ONBOARDING || 'false' }}
          # Username for GitHub authentication (should match GitHub App name + [bot])
          RENOVATE_USERNAME: ${{ env.RENOVATE_USERNAME || 'renovate-coop-norge[bot]' }}
          # Git commit author used, must match GitHub App
          RENOVATE_GIT_AUTHOR: ${{ env.RENOVATE_GIT_AUTHOR || 'renovate-coop-norge <151545514+renovate-coop-norge[bot]@users.noreply.github.com>' }}
          # Use GitHub API to create commits (this allows for signed commits from GitHub App)
          RENOVATE_PLATFORM_COMMIT: ${{ env.RENOVATE_PLATFORM_COMMIT || 'true' }}
          # Set the used managers, can be limited if we only want a certain manager
          RENOVATE_ENABLED_MANAGERS: ${{ steps.renovate_enabled_managers.outputs.managers || inputs.renovate-enabled-managers }}
          # Only includde certain paths, to improve performance
          RENOVATE_INCLUDE_PATHS: ${{ steps.renovate_enabled_managers.outputs.include_paths || inputs.renovate-include-paths }}
          RENOVATE_DEPENDENCY_DASHBOARD_TITLE: ${{ steps.renovate_enabled_managers.outputs.issue_title || steps.issue_title.outputs.issue_title || "Dependency Dashboard" }}
          # Override schedule if set
          RENOVATE_FORCE: ${{ env.RENOVATE_FORCE || 'true' }}
          RENOVATE_REPOSITORY_CACHE: true
          LOG_LEVEL: ${{ env.LOG_LEVEL || inputs.log-level || 'info' }}
          RENOVATE_DETECT_HOST_RULES_FROM_ENV: ${{ env.RENOVATE_DETECT_HOST_RULES_FROM_ENV || 'true' }}
          RENOVATE_GITHUB_COM_TOKEN: ${{ env.RENOVATE_GITHUB_COM_TOKEN || steps.get_github_token.outputs.token }}
          RENOVATE_DOCKER_DOCKER_IO_USERNAME: ${{ env.RENOVATE_DOCKER_DOCKER_IO_USERNAME || secrets.DOCKER_HUB_USERNAME }}
          RENOVATE_DOCKER_DOCKER_IO_PASSWORD: ${{ env.RENOVATE_DOCKER_DOCKER_IO_PASSWORD || secrets.DOCKER_HUB_PAT }}
          RENOVATE_TERRAFORM__MODULE_APP_SPACELIFT_IO_TOKEN: ${{ env.RENOVATE_TERRAFORM__MODULE_APP_SPACELIFT_IO_TOKEN || secrets.SPACELIFT_READ_TOKEN }}
          RENOVATE_TERRAFORM__MODULE_SPACELIFT_IO_TOKEN: ${{ env.RENOVATE_TERRAFORM__MODULE_SPACELIFT_IO_TOKEN || secrets.SPACELIFT_READ_TOKEN }}
          # need a PAT for the following because app tokens are not supported as of this writing: https://github.com/orgs/community/discussions/26920
          RENOVATE_NPM_NPM_PKG_GITHUB_COM_TOKEN: ${{ secrets.GH_PACKAGES_READ_PAT }}
          RENOVATE_NUGET_NUGET_PKG_GITHUB_COM_TOKEN: ${{ secrets.GH_PACKAGES_READ_PAT }}
          # making the PAT available for other use-cases, like downloading release assets for private repos
          GH_REPO_PAT: ${{ secrets.GH_REPO_PAT }}
          RENOVATE_ALLOWED_COMMANDS: '[".*"]'
          GONOPROXY: ${{ env.GONOPROXY || 'github.com/coopnorge,github:com/envoyproxy/protoc-gen-validate' }}
          GONOSUMDB: ${{ env.GONOSUMDB || 'github.com/coopnorge,github:com/envoyproxy/protoc-gen-validate' }}
          GOPRIVATE: ${{ env.GOPRIVATE || 'github.com/coopnorge' }}
        run: |
          # Forward relevant variables to GITHUB_ENV dynamically to avoid repeating them
          while IFS='=' read -r -d '' key value; do
            # Generate a unique delimiter for each variable
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)

            # Write using GitHub Actions multiline syntax
            echo "$key<<$EOF" >> "$GITHUB_ENV"
            echo "$value" >> "$GITHUB_ENV"
            echo "$EOF" >> "$GITHUB_ENV"
          done < <(env -0)

      - name: Populate post-upgrade env
        env:
          POST_UPGRADE_ENV_VARS: ${{ inputs.post-upgrade-env-vars }}
        run: |
          JSON_OBJ="{}"

          if [[ -n "$POST_UPGRADE_ENV_VARS" ]]; then
            while read -r line || [[ -n "$line" ]]; do
              if [[ -n "$line" ]]; then
                if [[ "$line" == *"="* ]]; then
                  KEY="${line%%=*}"
                  VALUE="${line#*=}"
                else
                  KEY="$line"
                  VALUE="${!KEY}"
                fi
                JSON_OBJ=$(echo "$JSON_OBJ" | jq -c --arg k "$KEY" --arg v "$VALUE" '.[$k] = $v')
              fi
            done <<< "$POST_UPGRADE_ENV_VARS"
          fi

          if [[ "$JSON_OBJ" != "{}" ]]; then
            echo "RENOVATE_CUSTOM_ENV_VARIABLES=$JSON_OBJ" >> $GITHUB_ENV
          fi

      - name: Restore renovate cache
        id: cache-restore
        if: github.event.inputs.repoCache != 'disabled' && github.event.inputs.repoCache != 'reset'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.cache_key }}-

      - name: Fix restored cache ownership
        if: steps.cache-restore.outputs.cache-matched-key != ''
        run: |
          sudo chown -R 12021:0 /tmp/renovate/
          ls -R $cache_dir

      - name: Run Renovate
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          configurationFile: ${{ inputs.config-file }}
          token: ${{ steps.get_github_token.outputs.token }}
          renovate-image: ${{ steps.renovate-version.outputs.renovate-image }}
          renovate-version: ${{ steps.renovate-version.outputs.renovate-version }}
          env-regex: ${{ steps.config-env.outputs.env-regex }}

      - name: Save renovate cache
        if: github.event.inputs.repoCache != 'disabled' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
